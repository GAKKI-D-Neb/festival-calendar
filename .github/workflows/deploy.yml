name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 03:17 JST every day

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch festival data
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          FESTIVAL_YEARS: ${{ vars.FESTIVAL_YEARS }}
        run: npm run fetch-data

      - name: Build
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_GOOGLE_FORM_EMBED_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_FORM_EMBED_URL }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_RELATED_CALENDAR_LINKS: ${{ vars.NEXT_PUBLIC_RELATED_CALENDAR_LINKS }}
          NEXT_PUBLIC_CONTACT_X_URL: ${{ vars.NEXT_PUBLIC_CONTACT_X_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
